{% extends "base.html" %}

{% block title %} Reportes {% endblock %}

{% block content %}

<div class="from-add">
    <form method="POST">
        <h2>Agregar un reporte</h2>
        <label for="servicio">Servicio a reportar</label><br>
        <select name="servicio" id="servicio" required>
            {% for s in services %}
                <option value="{{ s[0] }}">{{ s[1] }}</option>
            {% endfor %}
        </select><br>

        <label for="direccion">Direccion</label><br>
        <input type="text" name="direccion" id="direccion" required><br>

        <label for="urgencia">Urgencia</label><br>
        <select name="urgencia" id="urgencia">
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
        </select><br>

        <label for="descripcion">DEscripcion del susceso</label><br>
        <textarea name="descripcion" id="descripcion" placeholder="Maximo 250 caracteres" required></textarea>
        <small id="chars_count"></small>

        <div class="botones">
            <button class="button-generic" type="submit">Agregar</button>
            <a class="button-generic" href="{{ url_for('index') }}">Cancelar</a>
        </div>
    </form>
</div>

{% endblock %}
