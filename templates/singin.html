{% extends "base.html" %}

{% block title %} Servicios {% endblock %}

{% block content %}

<div class="form-add">
    <form method="POST">
        <label for="username">Nombre de usuario</label><br>
        <input type="text" name="username" id="username" required><br>

        <label for="edad">Edad</label><br>
        <input type="text" name="edad" id="edad" required><br>

        <label for="phone">Telefono (opcional)</label><br>
        <input type="text" name="phone" id="phone" required><br>

        <label for="password">Contraseña</label><br>
        <input type="text" name="password" id="password" required><br>

        <label for="password2">Confirmar Contraseña</label><br>
        <input type="text" name="password2" id="password2" required><br>

        <div class="botones">
            <button class="button-generic" type="submit">Agregar</button>
            <a class="button-generic" href="{{ url_for('index') }}">Cancelar</a>
        </div>
    </form>
</div>

{% endblock %}
