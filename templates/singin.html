{% extends "base.html" %}

{% block extra_css %} <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}"> {% endblock %}

{% block title %} Servicios {% endblock %}

{% block content %}

<main>
    <div class="triple-back">
        <div class="doble-back">
            <form method="POST">
                <h3>Ingrese sus credenciales</h3>
                <div>
                    <label for="username">Nombre de usuario</label><br>
                    <input type="text" name="username" id="log-username" required><br><br>

                    <label for="edad">Edad</label><br>
                    <input type="text" name="edad" id="edad" required><br><br>

                    <label for="phone">Telefono (opcional)</label><br>
                    <input type="text" name="phone" id="phone" required><br><br>

                    <label for="password">Contraseña</label><br>
                    <input type="password" name="password" id="log-password" required><br><br>

                    <label for="password2">Confirmar Contraseña</label><br>
                    <input type="text" name="password2" id="password2" required><br><br>

                </div>
                <div class="buttons">
                    <button type="submit" class="button-1">Enviar</button>
                    <a href="{{ url_for('index') }}" class="button-1">Cancelar</a>
                </div>
                <a class="link" href="{{ url_for('login') }}">Si ya tienes cuenta da click aquí</a>
            </form>
        </div>
    </div>
</main>

{% endblock %}
